        text: Containerized 8 internal tools with Docker so new environments took minutes instead of days.
        tags: [docker, automation]
        metric: 8 tools
        evidence: Internal wiki.
        limits: Internal tools, not customer-facing services.
        status: confirmed
      - id: tail-backup
        text: Rebuilt backups with restore tests every week, after finding the old backups could not be restored.
        tags: [backups, linux]
        metric: null
        evidence: null
        limits: null
        status: confirmed

